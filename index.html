<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی آنلاین من | ورود به سامانه</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            /* پس زمینه سه بعدی تیره */
            background: radial-gradient(circle at top left, #1a202c, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            perspective: 1000px; /* ایجاد حس عمق 3D */
        }

        /* حباب های شناور سه بعدی در پس زمینه */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 6s ease-in-out infinite;
        }
        .blob1 { width: 300px; height: 300px; background: #3b82f6; top: 10%; left: 10%; opacity: 0.5; }
        .blob2 { width: 250px; height: 250px; background: #10b981; bottom: 10%; right: 10%; opacity: 0.4; animation-delay: -3s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* کارت اصلی با افکت شیشه ای */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .card:hover {
            transform: translateY(-10px) rotateX(2deg) rotateY(-2deg);
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        p {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        /* استایل دکمه های سه بعدی */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 25px;
            position: relative;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            transform-style: preserve-3d;
        }

        .btn svg { margin-left: 10px; width: 22px; height: 22px; fill: currentColor; }

        /* دکمه سبز */
        .btn-login {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 0 #047857, 0 15px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-4px);
        }
        .btn-login:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 0 #047857, 0 20px 25px rgba(16, 185, 129, 0.5);
        }
        .btn-login:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #047857, 0 5px 10px rgba(16, 185, 129, 0.4);
        }

        /* دکمه آبی */
        .btn-class {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 8px 0 #1d4ed8, 0 15px 20px rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
        }
        .btn-class:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 0 #1d4ed8, 0 20px 25px rgba(59, 130, 246, 0.5);
        }
        .btn-class:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1d4ed8, 0 5px 10px rgba(59, 130, 246, 0.4);
        }

        @media (max-width: 768px) {
            .card { padding: 40px 25px; margin: 20px 0; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <!-- حباب های نورانی پس زمینه -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="card">
        <h1>آکادمی آنلاین من</h1>
        <p>به سامانه آموزشی هوشمند خوش آمدید. برای شرکت در کلاس‌ها و مشاهده آزمون‌ها وارد پنل کاربری خود شوید.</p>
        
        <!-- دکمه ورود به مودل -->
        <a href="https://shareate-school.moodlecloud.com" class="btn btn-login">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            ورود به پنل کاربری
        </a>
        
        <!-- دکمه ورود به کلاس گوگل میت -->
        <a href="https://meet.google.com/pty-ojxr-cco" class="btn btn-class" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            ورود مستقیم به کلاس آنلاین
        </a>
    </div>

</body>
</html>
