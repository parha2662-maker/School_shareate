<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی آنلاین من</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background: radial-gradient(circle at top left, #1a202c, #0f172a); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }
        .container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 40px; max-width: 450px; width: 92%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; }
        .hidden { display: none !important; }
        h1 { font-size: 26px; margin-bottom: 20px; color: #60a5fa; }
        h2 { font-size: 20px; margin-bottom: 20px; color: #10b981; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; font-size: 16px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #3b82f6; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-admin { background: #f59e0b; }
        .btn-green { background: #10b981; }
        .btn-red { background: #ef4444; }
        .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; margin-bottom: 15px; text-align: right; border-right: 4px solid #3b82f6; }
        .user-list { text-align: right; margin-top: 15px; max-height: 150px; overflow-y: auto; }
        .user-item { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; }
        .back-link { color: #94a3b8; font-size: 13px; cursor: pointer; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="view-main">
            <h1>آکادمی آنلاین من</h1>
            <p style="color: #94a3b8; margin-bottom: 30px;">به سامانه آموزشی خوش آمدید</p>
            <button onclick="showView('view-student-login')">ورود دانش‌آموز</button>
            <button class="btn-admin" onclick="showView('view-admin-login')">ورود مدیریت (مدیر)</button>
        </div>

        <div id="view-admin-login" class="hidden">
            <h1 style="color: #f59e0b;">ورود مدیریت</h1>
            <input type="password" id="admin-pass" placeholder="رمز مدیریت (parham2010)">
            <button class="btn-admin" onclick="checkAdmin()">ورود</button>
            <span class="back-link" onclick="showView('view-main')">بازگشت</span>
        </div>

        <div id="view-admin-panel" class="hidden">
            <h2>پنل مدیریت</h2>
            <button class="btn-green" onclick="showView('view-add-user')">➕ افزودن کاربر</button>
            <p style="margin-top: 20px; text-align: right; font-size: 14px;">کاربران دیتابیس:</p>
            <div class="user-list" id="user-list-container"></div>
            <button class="btn-red" style="margin-top: 20px;" onclick="showView('view-main')">خروج</button>
        </div>

        <div id="view-add-user" class="hidden">
            <h2>افزودن کاربر</h2>
            <input type="text" id="new-name" placeholder="نام (مثلا علی)">
            <input type="text" id="new-username" placeholder="آیدی (مثلا ali123)">
            <input type="password" id="new-password" placeholder="رمز عبور">
            <button class="btn-green" onclick="addUser()">ذخیره</button>
            <span class="back-link" onclick="showView('view-admin-panel')">بازگشت</span>
        </div>

        <div id="view-student-login" class="hidden">
            <h1>ورود دانش‌آموز</h1>
            <input type="text" id="login-username" placeholder="آیدی">
            <input type="password" id="login-password" placeholder="رمز">
            <button onclick="studentLogin()">ورود به کلاس</button>
            <span class="back-link" onclick="showView('view-main')">بازگشت</span>
        </div>

        <div id="view-student-panel" class="hidden">
            <h2>خوش آمدی، <span id="student-name"></span> 👋</h2>
            <div class="card">
                <h3>📚 کلاس آنلاین</h3>
                <button class="btn-green" style="margin-top: 10px;" onclick="window.open('https://meet.google.com/pty-ojxr-cco', '_blank')">ورود به کلاس</button>
            </div>
            <button class="btn-red" onclick="showView('view-main')">خروج</button>
        </div>
    </div>

    <script>
        // اطلاعات دیتابیس تو اینجاست
        const SUPABASE_URL = 'https://fsplrygrrlujxzhftbmo.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_8nabIvaquNCZO28qFZlLKA_pR47OdtC';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showView(viewId) {
            document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            if (viewId === 'view-admin-panel') loadUsers();
        }

        function checkAdmin() {
            if (document.getElementById('admin-pass').value === 'parham2010') {
                showView('view-admin-panel');
            } else { alert('رمز اشتباه است!'); }
        }

        async function addUser() {
            const name = document.getElementById('new-name').value;
            const username = document.getElementById('new-username').value;
            const password = document.getElementById('new-password').value;

            if(!name || !username || !password) return alert('همه فیلدها را پر کنید');

            const { error } = await supabaseClient.from('users').insert([{ name, username, password }]);
            
            if (error) {
                alert(error.code === '23505' ? 'این آیدی تکراری است!' : 'خطا: ' + error.message);
            } else {
                alert('کاربر ذخیره شد!');
                document.getElementById('new-name').value = '';
                document.getElementById('new-username').value = '';
                document.getElementById('new-password').value = '';
                showView('view-admin-panel');
            }
        }

        async function loadUsers() {
            const container = document.getElementById('user-list-container');
            container.innerHTML = 'در حال دریافت...';
            const { data: users, error } = await supabaseClient.from('users').select('*');
            container.innerHTML = '';
            if (error || users.length === 0) return container.innerHTML = 'هیچ کاربری نیست.';
            users.forEach(u => {
                container.innerHTML += `<div class="user-item"><span>${u.name}</span><span style="color: #60a5fa;">${u.username}</span></div>`;
            });
        }

        async function studentLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const { data: users } = await supabaseClient.from('users').select('*').eq('username', username).eq('password', password);
            
            if (users && users.length > 0) {
                document.getElementById('student-name').innerText = users[0].name;
                showView('view-student-panel');
            } else { alert('آیدی یا رمز اشتباه است!'); }
        }
    </script>
</body>
</html>
